name: Verify configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-arch-container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Build and verify Arch container
        run: podman build --tag dotfiles-config-test:ci --file Containerfile .
